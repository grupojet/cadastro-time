name: decode-foto
on:
  push:
    paths:
      - 'pessoas/**/*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode b64
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir=$(dirname "$f")
            python3 -c "import base64,pathlib; p=pathlib.Path('$f'); pathlib.Path('$dir/foto.jpg').write_bytes(base64.b64decode(''.join(p.read_text().split())))"
            git add "$dir/foto.jpg"
            git rm -f "$f"
            found=1
          done < <(find pessoas -name '*.b64' -print)
          if [ "$found" = 1 ]; then
            git config user.name cadastro-bot
            git config user.email cadastro-bot@grupojet.local
            git commit -m "foto.jpg na pasta da pessoa"
            git push
          fi
