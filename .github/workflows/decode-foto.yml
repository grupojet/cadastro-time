name: decode-foto
on:
  workflow_dispatch:
    inputs:
      pasta:
        required: true
        type: string
      b64:
        required: true
        type: string
  push:
    paths:
      - 'pessoas/**/*.b64'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PASTA: ${{ github.event.inputs.pasta }}
          B64: ${{ github.event.inputs.b64 }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            async function put(path, message, contentB64) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({ owner, repo, path });
                sha = existing.data.sha;
              } catch (e) {}
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message, content: contentB64, sha });
            }
            if (context.eventName === 'workflow_dispatch') {
              const pasta = String(process.env.PASTA || '').replace(/\/+$/, '');
              const b64 = String(process.env.B64 || '').replace(/\s/g, '');
              if (!pasta || !b64) throw new Error('faltou pasta ou b64');
              await put(pasta + '/foto.jpg', 'foto ' + pasta, b64);
              return;
            }
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: context.sha, recursive: '1' });
            const files = (tree.data.tree || []).filter((t) => t.path && t.path.endsWith('.b64') && t.path.startsWith('pessoas/'));
            for (const f of files) {
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: f.sha });
              const text = Buffer.from(blob.data.content, 'base64').toString('utf8').replace(/\s/g, '');
              const dir = f.path.slice(0, f.path.lastIndexOf('/'));
              await put(dir + '/foto.jpg', 'foto ' + dir, text);
            }
