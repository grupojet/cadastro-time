name: pasta-pessoa
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: read
jobs:
  pasta:
    if: startsWith(github.event.issue.title, '[cadastro-time]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const m = body.match(/```json\n([\s\S]*?)```/);
            if (!m) return;
            const data = JSON.parse(m[1]);
            const p = data.payload || data;
            const slug = String(p.nome || 'pessoa')
              .toLowerCase()
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '')
              .slice(0, 40) || 'pessoa';
            const wa = String(p.whatsapp || '').replace(/\D/g, '').slice(-4);
            const dir = 'pessoas/' + slug + (wa ? '-' + wa : '');
            const ficha = Object.assign({}, p, { pasta: dir, issue: issue.number, updatedAt: new Date().toISOString() });
            const dataUrl = String(p.fotoDataUrl || '');
            delete ficha.fotoDataUrl;
            ficha.foto = !!dataUrl || !!p.foto;
            const path = dir + '/ficha.json';
            const content = Buffer.from(JSON.stringify(ficha, null, 2)).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path });
              sha = existing.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'pasta ' + dir,
              content,
              sha,
            });
            const mm = dataUrl.match(/^data:image\/(jpeg|jpg|png|webp);base64,([A-Za-z0-9+/=]+)$/);
            if (!mm) return;
            const ext = mm[1] === 'png' ? 'png' : mm[1] === 'webp' ? 'webp' : 'jpg';
            const fotoPath = dir + '/foto.' + ext;
            let fotoSha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: fotoPath });
              fotoSha = existing.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: fotoPath,
              message: 'foto ' + dir,
              content: mm[2],
              sha: fotoSha,
            });
