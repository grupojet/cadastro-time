name: Cadastro time from issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  save:
    if: startsWith(github.event.issue.title, '[cadastro-time]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write submission
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          N: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p submissions
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          FILE="submissions/${STAMP}-issue-${N}.md"
          {
            echo "# $TITLE"
            echo
            echo "$BODY"
          } > "$FILE"
          git config user.name "cadastro-bot"
          git config user.email "cadastro-bot@grupojet.local"
          git add submissions
          git commit -m "cadastro: issue #$N" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retry..."
            sleep $((i*2))
            git rebase --abort 2>/dev/null || true
            git fetch origin main
          done
          echo "FAILED to push after retries" >&2
          exit 1
      - name: Comment ack
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Cadastro recebido e gravado em `submissions/`. Ops interno — sem OS cliente.'
            })
