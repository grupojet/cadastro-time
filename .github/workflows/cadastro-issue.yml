name: Cadastro time from issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  save:
    if: startsWith(github.event.issue.title, '[cadastro-time]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write submission
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          N: ${{ github.event.issue.number }}
        run: |
          mkdir -p submissions
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          FILE="submissions/${STAMP}-issue-${N}.md"
          {
            echo "# $TITLE"
            echo
            echo "$BODY"
          } > "$FILE"
          git config user.name "cadastro-bot"
          git config user.email "cadastro-bot@grupojet.local"
          git add submissions
          git commit -m "cadastro: issue #$N" || exit 0
          git push
      - name: Comment ack
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Cadastro recebido e gravado em `submissions/`. Ops interno — sem OS cliente.'
            })
