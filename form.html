<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#E8E8E8"/>
<title>Cadastro do time | Grupo Jet</title>
<style>
html,body{margin:0;width:100%;background:#E8E8E8;color:#3D3D3D;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:18px}
body{padding:16px}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:28px;color:#5A5A5A}
.block{background:#fff;border:1px solid #D0D0D0;border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;margin:12px 0 6px;font-weight:600;color:#5A5A5A}
input,select,textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #D0D0D0;border-radius:12px;font-size:17px;min-height:52px}
button.primary{width:100%;border:0;background:#FF5722;color:#fff;font-weight:700;padding:16px;border-radius:12px;min-height:56px;font-size:18px}
.ok{margin-top:10px;color:#FF5722;font-weight:600}
.req{color:#FF5722}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quem é quem</h1>
  <div class="block">
    <label for="nome">Nome completo <span class="req">*</span></label>
    <input id="nome" autocomplete="name"/>
    <label for="wa">WhatsApp <span class="req">*</span></label>
    <input id="wa" inputmode="tel" autocomplete="tel" placeholder="62 9XXXX-XXXX"/>
    <label for="papel">Papel <span class="req">*</span></label>
    <select id="papel">
      <option value="">Toque para escolher…</option>
      <option value="socio">Sócio</option>
      <option value="tecnico">Técnico de campo</option>
      <option value="noc">NOC / Operações</option>
      <option value="projetos">Projetos</option>
      <option value="financeiro">Financeiro</option>
      <option value="comercial">Comercial</option>
      <option value="rh">RH / Admin</option>
      <option value="ti">TI / Sistemas</option>
      <option value="coordenacao">Coordenação / Gestão</option>
      <option value="outro">Outro</option>
    </select>
    <label for="cidade">Cidade base <span class="req">*</span></label>
    <input id="cidade" placeholder="Goiânia"/>
    <label for="obs">Observação</label>
    <textarea id="obs" placeholder="Turno, equipe, se é responsável do setor"></textarea>
  </div>
  <button class="primary" type="button" id="btnSend">Enviar dados</button>
  <p class="ok" id="ok"></p>
</div>
<script>
document.getElementById('btnSend').onclick = function () {
  var nome = document.getElementById('nome').value.trim();
  var wa = document.getElementById('wa').value.trim();
  var papel = document.getElementById('papel').value;
  var cidade = document.getElementById('cidade').value.trim();
  var obs = document.getElementById('obs').value.trim();
  var ok = document.getElementById('ok');
  if (!nome || !wa || !papel || !cidade) {
    ok.textContent = 'Falta preencher: nome, WhatsApp, papel e cidade.';
    return;
  }
  var payload = {
    type: 'cadastro-time',
    payload: { nome: nome, whatsapp: wa, papel: papel, cidade: cidade, obs: obs },
    sentAt: new Date().toISOString()
  };
  var title = '[cadastro-time] ' + nome + ' — ' + papel;
  var body = '## Cadastro do time (ops interno)\n\n```json\n' + JSON.stringify(payload, null, 2) + '\n```\n';
  ok.textContent = 'Abrindo o GitHub… toque em Submit.';
  location.href = 'https://github.com/grupojet/cadastro-time/issues/new?title=' +
    encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
};
</script>
</body>
</html>
