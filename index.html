<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#E8E8E8"/>
<title>Cadastro do time | Grupo Jet</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#E8E8E8;color:#5A5A5A;padding:24px;text-align:center}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#FF5722;margin:0 3px;animation:b 1s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>
</head>
<body>
  <p>Carregando cadastro do time…</p>
  <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  <noscript>Ative o JavaScript para abrir o formulário.</noscript>
<script>
(async function(){
  try {
    var n = 4;
    var parts = [];
    var base = (function(){
      var s = document.currentScript;
      if (s && s.src) return s.src.replace(/[^\/]*$/, '');
      var u = location.href.split('?')[0];
      return u.replace(/[^\/]*$/, '');
    })();
    for (var i = 0; i < n; i++) {
      var r = await fetch(base + 'part' + i + '.txt', {cache:'no-store'});
      if (!r.ok) throw new Error('part ' + i + ' HTTP ' + r.status);
      parts.push(await r.text());
    }
    var html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="color:#FF5722;font-weight:700">Não deu pra carregar o formulário.</p><p>' + String(e) + '</p><p>Atualize a página ou avise o JOTA.</p>';
  }
})();
</script>
</body>
</html>
