<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Cadastro do time | Grupo Jet</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#E8E8E8;color:#5A5A5A;padding:24px;text-align:center}</style>
</head><body>
<p>Carregando cadastro do time…</p>
<script>
(async function(){
  var n=4, parts=[], base='https://cdn.jsdelivr.net/gh/grupojet/cadastro-time@6063f57c968511793a6b3df0cf51660188f76881/';
  try {
    for (var i=0;i<n;i++){
      var r=await fetch(base+'part'+i+'.txt',{cache:'no-store'});
      if(!r.ok) throw new Error('part '+i+' HTTP '+r.status);
      parts.push(await r.text());
    }
    document.open(); document.write(parts.join('')); document.close();
  } catch(e) {
    document.body.innerHTML='<p style="color:#FF5722;font-weight:700">Falha ao carregar.</p><p>'+e+'</p>';
  }
})();
</script>
</body></html>
